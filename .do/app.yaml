# DigitalOcean App Platform spec.
#
# As written this deploys a WORKING API out of the box: fast Kokoro voice on CPU,
# ephemeral local storage. Create it with:
#   doctl apps create --spec .do/app.yaml
# (or dashboard: Create App -> this repo -> it uses this spec).
#
# Then upgrade with env vars (dashboard, or `doctl apps update <id> --spec ...`):
#   Natural voice  -> deploy backend/modal_chatterbox.py, then set
#                     SANGYIN_TTS_ENGINE=chatterbox
#                     SANGYIN_CHATTERBOX_URL=https://<you>--sangyin-chatterbox-web.modal.run
#   Persistent R2  -> App Platform disk is ephemeral, so for real use set
#                     SANGYIN_R2_ACCOUNT_ID / SANGYIN_R2_BUCKET /
#                     SANGYIN_R2_ACCESS_KEY / SANGYIN_R2_SECRET_KEY (keys as SECRET)
name: sangyin-backend
region: nyc
services:
  - name: api
    source_dir: backend
    dockerfile_path: backend/Dockerfile  # forces a Docker build, not the Python buildpack
    github:
      repo: A-Pamimo/sangyin
      branch: claude/ios-eas-setup
      deploy_on_push: true
    http_port: 8080
    # Kokoro needs ~2 GB. If doctl rejects this slug, run
    #   doctl apps tier instance-size list
    # and pick a ~2 GB one.
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: SANGYIN_CORS_ORIGINS
        value: "*"
      # Natural voice: Chatterbox on Modal's serverless GPU (scales to zero).
      - key: SANGYIN_TTS_ENGINE
        value: chatterbox
      - key: SANGYIN_CHATTERBOX_URL
        value: https://a-pamimo--sangyin-chatterbox-web.modal.run
      # (Set kokoro instead to fall back to the fast local CPU voice.)

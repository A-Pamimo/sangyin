name: Deploy to GitHub Pages

# Builds the Expo reader app (static web export) and deploys it at the site root.
# The site is served under the repo prefix /sangyin/, which matches the app's
# experiments.baseUrl (/sangyin), so routes resolve cleanly: /sangyin/,
# /sangyin/reader, /sangyin/library, /sangyin/settings.
on:
  push:
    branches: [claude/sangyin-audio-reader-lwih1j, claude/github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app deps
        working-directory: app
        run: npm ci

      - name: Export app (static web)
        working-directory: app
        env:
          EXPO_PUBLIC_BACKEND_URL: https://sangyin-backend-inwls.ondigitalocean.app
        run: npx expo export --platform web

      # ---- Compose the deployed tree: reader app at the site root ----
      - name: Assemble _site (reader app at root)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r app/dist/. _site/
          touch _site/.nojekyll   # keep Expo's _expo/ dir (Jekyll drops leading-underscore paths)

      # ---- Verify the app honors baseUrl /sangyin ----
      - name: Check app base path
        run: |
          set -euo pipefail
          if grep -q '/sangyin/_expo\|href="/sangyin' _site/index.html; then
            echo "OK: app assets reference /sangyin"
          else
            echo "::warning::_site/index.html does not reference /sangyin — the app may 404. Check app.json experiments.baseUrl."
            echo "----- head of _site/index.html -----"
            head -n 40 _site/index.html || true
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
